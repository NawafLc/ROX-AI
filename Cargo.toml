[package]
name = "roxai"
version = "2.0.0"
edition = "2021"
description = "ROX-AI: Claude-powered Roblox chart analyst & AI playtester that builds an Obsidian vault of game blueprints"
license = "MIT"
default-run = "ROX-AI"

[lib]
name = "roxai"
path = "src/lib.rs"

[[bin]]
name = "roxai"
path = "src/main.rs"

# The app you double-click. Same program as `roxai`, but without a console window
# (also used by scheduled tasks so nothing ever flashes on screen).
[[bin]]
name = "ROX-AI"
path = "src/bin/app.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }
# Pure-Rust stack (no C compiler needed): native TLS = SChannel on Windows
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
