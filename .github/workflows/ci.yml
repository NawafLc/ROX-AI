name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1"   # weekly: catches Roblox API changes early

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test
      - name: Live Roblox scan (real API)
        run: |
          mkdir -p "$RUNNER_TEMP/rx"
          echo "{\"vault_path\":\"$RUNNER_TEMP/rx/vault\",\"chart_limit\":5}" > "$RUNNER_TEMP/rx/settings.json"
          ROXAI_HOME="$RUNNER_TEMP/rx" cargo run --quiet -- scan
          ls "$RUNNER_TEMP/rx/vault/02 Games"

  windows:
    runs-on: windows-latest
    env:
      ROXAI_VERSION: 2.0.${{ github.run_number }}   # baked into the exe; the Update button compares it with GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Self-test (real Win32 input, capture, hooks, scheduler)
        run: .\target\release\roxai.exe selftest
      - name: Package (portable folder)
        shell: pwsh
        run: |
          $d = "dist\ROX-AI"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item target\release\ROX-AI.exe, target\release\roxai.exe, dist-files\README.txt $d
          Compress-Archive -Path $d -DestinationPath dist\ROX-AI-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ROX-AI-windows-x64
          path: dist/ROX-AI-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-capture
          path: ${{ runner.temp }}/roxai-capture.jpg
          if-no-files-found: ignore

  portable:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ROX-AI-windows-x64
      - name: Unzip like a user would
        shell: pwsh
        run: Expand-Archive ROX-AI-windows-x64.zip -DestinationPath user
      - name: First start (silent setup + chart scan)
        shell: pwsh
        run: |
          $app = "user\ROX-AI"
          & "$app\roxai.exe" setup
          & "$app\roxai.exe" scan
          if ($LASTEXITCODE -ne 0) { throw "scan failed" }
      - name: Verify everything stayed in the folder
        shell: pwsh
        run: |
          $app = (Resolve-Path "user\ROX-AI").Path
          if (-not (Test-Path "$app\data\settings.json")) { throw "data not portable" }
          if (-not (Test-Path "$app\ROX-AI Vault\00 Dashboard.md")) { throw "vault not portable" }
          $n = (Get-ChildItem "$app\ROX-AI Vault\02 Games").Count
          Write-Host "$n game notes"; if ($n -lt 5) { throw "too few game notes" }
          if (Test-Path "$env:LOCALAPPDATA\ROX-AI\settings.json") { throw "wrote outside the portable folder" }
          if (Test-Path "$env:USERPROFILE\Documents\ROX-AI Vault") { throw "wrote a vault into Documents" }
          $cfg = Get-Content "$env:APPDATA\Claude\claude_desktop_config.json" -Raw
          $cfg
          if ($cfg -notmatch [regex]::Escape(($app -replace '\\','\\'))) { throw "Claude Desktop not pointed at the portable exe" }
          schtasks /Query /TN "ROX-AI\Daily Chart Scan" /V /FO LIST | Select-String "Task To Run"
          schtasks /Query /TN "ROX-AI\Weekly Playtests" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "schedule missing" }
      - name: MCP handshake against the portable exe
        shell: pwsh
        run: |
          $in = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}',
            '{"jsonrpc":"2.0","method":"notifications/initialized"}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          ) -join "`n"
          $out = $in | & "user\ROX-AI\roxai.exe" mcp
          if (-not ($out -match '"serverInfo"')) { throw "no initialize response" }
          if (-not ($out -match 'playtest_start')) { throw "tools missing" }
      - name: Version + update check
        shell: pwsh
        run: |
          $v = & "user\ROX-AI\roxai.exe" --version
          $v
          if ($v -notmatch "2\.0\.${{ github.run_number }}") { throw "version not stamped" }
          & "user\ROX-AI\roxai.exe" update --check
      - name: Remove from this PC
        shell: pwsh
        run: |
          & "user\ROX-AI\roxai.exe" remove
          schtasks /Query /TN "ROX-AI\Daily Chart Scan" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "schedule still there" }
          if ((Get-Content "$env:APPDATA\Claude\claude_desktop_config.json" -Raw) -match '"roxai"') { throw "Claude Desktop still connected" }

  release:
    needs: [portable, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ROX-AI-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: ROX-AI v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: ROX-AI-windows-x64.zip
          body: |
            **Download `ROX-AI-windows-x64.zip`, unzip it anywhere, double-click `ROX-AI.exe`.** Portable: nothing is installed.
            Built from ${{ github.sha }} (branch ${{ github.ref_name }}). Tested on Windows: unit/integration tests, Win32 self-test, portable first start, MCP handshake, removal.
