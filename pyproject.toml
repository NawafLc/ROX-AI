[project]
name = "roxai"
version = "1.0.0"
description = "ROX-AI: Claude-powered Roblox chart analyst & AI playtester that builds an Obsidian vault of game blueprints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "httpx>=0.27",
  "pillow>=10.0",
  "mss>=9.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
roxai = "roxai.cli:main"
roxai-mcp = "roxai.mcp_server:main"

[project.gui-scripts]
roxai-panel = "roxai.panel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roxai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
